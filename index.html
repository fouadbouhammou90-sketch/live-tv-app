<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0a1930">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="لوحة إدارة RAYA TV PRO">
  <title>RAYA TV PRO | لوحة التحكم</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- أيقونات SVG -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5M5.5 10v9.5a.5.5 0 0 0 .5.5h4v-6h4v6h4a.5.5 0 0 0 .5-.5V10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H9l2 2.5h7.5A2.5 2.5 0 0 1 21 10v7.5a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
      <symbol id="i-tv" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12.5" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m8.5 3 3.5 3 3.5-3M9 21.5h6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-ball" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m12 8 3.2 2.3-1.2 3.7h-4l-1.2-3.7zM12 8V3.7M15.2 10.3l4-1.3M14 14l2.5 3.4M10 14l-2.5 3.4M8.8 10.3l-4-1.3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
      <symbol id="i-edit" viewBox="0 0 24 24"><path d="m4 20 1-4.2L16.3 4.5a1.8 1.8 0 0 1 2.5 0l.7.7a1.8 1.8 0 0 1 0 2.5L8.2 19zM14.5 6.5l3 3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 7h15M9.5 7V4.8c0-.4.3-.8.8-.8h3.4c.5 0 .8.4.8.8V7M6.5 7l.8 12a1.5 1.5 0 0 0 1.5 1.4h6.4a1.5 1.5 0 0 0 1.5-1.4l.8-12M10 11v5.5M14 11v5.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="11" height="11" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M15.5 8.5V6.2A2.2 2.2 0 0 0 13.3 4H6.2A2.2 2.2 0 0 0 4 6.2v7.1a2.2 2.2 0 0 0 2.2 2.2h2.3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="m16 16 4 4" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></symbol>
      <symbol id="i-logout" viewBox="0 0 24 24"><path d="M14 4.5h3.5A2.5 2.5 0 0 1 20 7v10a2.5 2.5 0 0 1-2.5 2.5H14M10 8l-4 4 4 4M6 12h9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-image" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="9" cy="10" r="1.6" fill="currentColor"/><path d="m4 17 5-4.5 3.5 3L16 12l4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-live" viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.4" fill="currentColor"/><path d="M7.5 7.5a6.4 6.4 0 0 0 0 9M16.5 7.5a6.4 6.4 0 0 1 0 9M4.6 4.6a10.5 10.5 0 0 0 0 14.8M19.4 4.6a10.5 10.5 0 0 1 0 14.8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
      <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 3.5 9 4.8-9 4.8-9-4.8zM3.5 12.3l8.5 4.5 8.5-4.5M3.5 16.3l8.5 4.5 8.5-4.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-upload" viewBox="0 0 24 24"><path d="M4 16v1a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3v-1m-4-8-4-4m0 0L8 8m4-4v12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
      <symbol id="i-notification" viewBox="0 0 24 24"><path d="M6 16.5V11a6 6 0 1 1 12 0v5.5l1.5 2h-15zM10 20.5a2 2 0 0 0 4 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 16.5V11a6 6 0 1 1 12 0v5.5l1.5 2h-15zM10 20.5a2 2 0 0 0 4 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-send" viewBox="0 0 24 24"><path d="M21 3 10.5 13.5M21 3l-6.5 18-4-7.5L3 9.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-up" viewBox="0 0 24 24"><path d="m6 14.5 6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9.5 6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    </defs>
  </svg>

  <!-- تسجيل الدخول -->
  <div id="loginScreen" class="auth-container">
    <div class="auth-glow"></div>
    <div class="auth-card">
      <div class="brand-mark">R</div>
      <div class="brand-title">RAYA <b>TV PRO</b></div>
      <p class="subtitle">لوحة الإدارة والتحكم</p>
      <form id="loginForm">
        <div class="input-group">
          <label for="email">البريد الإلكتروني</label>
          <input id="email" type="email" autocomplete="username" placeholder="admin@example.com" required dir="ltr">
        </div>
        <div class="input-group">
          <label for="password">كلمة المرور</label>
          <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" required dir="ltr">
        </div>
        <button type="submit" class="btn-gold" id="loginBtn">تسجيل الدخول</button>
        <p id="loginMsg" class="msg" role="alert"></p>
      </form>
      <div class="auth-note">نظام إدارة RAYA TV PRO</div>
    </div>
  </div>

  <!-- اللوحة -->
  <div id="dashboardScreen" class="dashboard-layout" hidden>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="brand-mark small">R</div>
        <div><strong>RAYA <b>TV PRO</b></strong><small>لوحة الإدارة الشاملة</small></div>
      </div>
      <nav class="sidebar-nav" aria-label="القائمة الرئيسية">
        <button data-tab="home" class="active"><svg class="ico"><use href="#i-home"/></svg><span>الرئيسية</span></button>
        <button data-tab="categories"><svg class="ico"><use href="#i-folder"/></svg><span>الأقسام</span></button>
        <button data-tab="channels"><svg class="ico"><use href="#i-tv"/></svg><span>القنوات</span></button>
        <button data-tab="matches"><svg class="ico"><use href="#i-ball"/></svg><span>المباريات</span></button>
        <button data-tab="privateStreams"><svg class="ico"><use href="#i-shield"/></svg><span>روابط البث الآمنة</span></button>
        <button data-tab="notifications"><svg class="ico"><use href="#i-notification"/></svg><span>إدارة الإشعارات</span></button>
        <button data-tab="import"><svg class="ico"><use href="#i-upload"/></svg><span>استيراد JSON</span></button>
      </nav>
      <div class="sidebar-footer">
        <div class="admin-chip"><span class="admin-dot"></span><span>متصل بحساب المشرف</span></div>
        <button id="logoutBtn" class="btn-logout"><svg class="ico"><use href="#i-logout"/></svg>تسجيل الخروج</button>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div class="topbar-brand"><div class="brand-mark small">R</div></div>
        <div class="topbar-heading"><span class="eyebrow">RAYA TV PRO</span><h1 id="pageTitle">الرئيسية</h1></div>
        <div class="user-info"><span class="user-avatar">A</span><span class="user-name">مدير النظام</span></div>
        <button id="logoutBtnMobile" class="icon-btn mobile-only" aria-label="تسجيل الخروج"><svg class="ico"><use href="#i-logout"/></svg></button>
      </header>
      <div id="tabContent" class="tab-body" aria-live="polite"></div>
      <footer class="page-footer">RAYA TV PRO <span>•</span> لوحة التحكم</footer>
    </main>

    <nav class="bottom-nav" aria-label="التنقل">
      <button data-tab="home" class="active"><svg class="ico"><use href="#i-home"/></svg><span>الرئيسية</span></button>
      <button data-tab="categories"><svg class="ico"><use href="#i-folder"/></svg><span>الأقسام</span></button>
      <button data-tab="channels"><svg class="ico"><use href="#i-tv"/></svg><span>القنوات</span></button>
      <button data-tab="matches"><svg class="ico"><use href="#i-ball"/></svg><span>المباريات</span></button>
      <button data-tab="privateStreams"><svg class="ico"><use href="#i-shield"/></svg><span>آمنة</span></button>
      <button data-tab="notifications"><svg class="ico"><use href="#i-notification"/></svg><span>إشعارات</span></button>
      <button data-tab="import"><svg class="ico"><use href="#i-upload"/></svg><span>استيراد</span></button>
    </nav>
  </div>

  <div id="modalOverlay" class="modal-overlay" hidden>
    <section id="modalContainer" class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle"></section>
  </div>
  <div id="toastRegion" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
